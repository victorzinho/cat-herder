# The sample workspace every CLI test runs in: the tests copy this directory to a temporary one, make each repository
# a git repository and code/sat-worktree a worktree of sat. Paths are relative to this directory.
data_dir: data
sources:
  jira:
    type: jira
    url: https://example.atlassian.net
    access: full
    fetch_window_seconds: 60
    done_statuses: [Done]
    blocking_relation: blocks
    fields: {points: customfield_10035, sprints: customfield_10020}
    custom_fields: {size: customfield_10043, team: customfield_10044}
    credentials: {email: {env: JIRA_EMAIL}, token: {env: JIRA_TOKEN}}
  toggl:
    type: toggl
    workspace: 1
    access: read-only
    fetch_window_seconds: 900
    history_from: '2026-01-01T00:00:00Z'
    credentials: {token: {env: TOGGL_TOKEN}}
people:
  ana:
    identities: {jira: account-ana, toggl: 456}
    weekly_capacity: {hours: 20, projects: {sat: 10}}
repositories:
  sat: code/sat
  sat-meteo: code/sat-meteo
  tools: code/tools
  website: music/website
projects:
  sat:
    tickets: {source: jira, space: SAT}
    time: {source: toggl, spaces: [SAT]}
    repositories: [sat, sat-meteo]
  ops:
    tickets: {source: jira, space: OPS}
    time: {source: toggl, spaces: [OPS]}
    repositories: [sat-meteo]
  web:
    tickets: {source: jira, space: WEB}
    time: {source: toggl, spaces: [WEB]}
    repositories: [website]
