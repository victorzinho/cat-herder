[project]
name = "cat-herder"
version = "0.1.0"
description = "Tickets and hours from separate tools, such as Jira and Toggl, in one place"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Víctor González" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "pyyaml>=6.0.3",
    "rfc3339-validator>=0.1.4",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
cat-herder = "cat_herder.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "import-linter>=2.16",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "time-machine>=3.6.0",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["."]  # Makes the helper modules in tests/ importable under importlib mode

[tool.coverage.run]
source = ["cat_herder"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "cat_herder"

[[tool.importlinter.contracts]]
name = "Layers: cli -> services -> store | sources -> domain"
type = "layers"
containers = ["cat_herder"]
layers = ["cli", "(services)", "(store) | (sources)", "domain"]
exhaustive = true
