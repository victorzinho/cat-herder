$schema: https://json-schema.org/draft/2020-12/schema
title: cat-herder config
description: |
  The tool refuses to work without a valid config. It also rejects what this schema can't express:

  - A reference to a source, repository or project that isn't defined.
  - `tickets.source` pointing at a time source, or `time.source` pointing at a ticket source.
  - A time source's space used twice, in the same project or in different ones.
type: object
additionalProperties: false
required: [data_dir, sources, projects]
properties:
  data_dir:
    type: string
    description: Directory for the local database and downloaded attachments. A leading `~` expands to the home directory.
  default_non_ticket_percent:
    type: number
    description: Share of capacity set aside for non-ticket work when planning a sprint, for projects with no ended sprints or no time source. Without it, those projects set nothing aside.
    minimum: 0
    maximum: 100
  capacity_margin_hours:
    type: number
    description: How many hours assigned above or below a capacity for tickets sprint reports accept before listing it in `wont_fit` or `spare_capacity`.
    minimum: 0
    default: 1
  sources:
    type: object
    description: Ticket and time systems, by slug. The slug is what qualifies keys, as in `jira:SAT-7`.
    minProperties: 1
    propertyNames: {$ref: '#/$defs/slug'}
    additionalProperties:
      type: object
      required: [type]
      properties:
        type: {enum: [jira, toggl]}
      allOf:
        - if: {properties: {type: {const: jira}}}
          then: {$ref: '#/$defs/jira_source'}
        - if: {properties: {type: {const: toggl}}}
          then: {$ref: '#/$defs/toggl_source'}
  people:
    type: object
    description: People, by slug. Someone with no entry here appears as unknown, with their ID in the source, and their hours still count.
    propertyNames: {$ref: '#/$defs/slug'}
    additionalProperties: {$ref: '#/$defs/person'}
  repositories:
    type: object
    description: Local git repositories, by slug. Each value is the path to the main repository; its worktrees count as the same repository.
    propertyNames: {$ref: '#/$defs/slug'}
    additionalProperties:
      type: string
  projects:
    type: object
    description: Projects, by slug.
    minProperties: 1
    propertyNames: {$ref: '#/$defs/slug'}
    additionalProperties: {$ref: '#/$defs/project'}

$defs:
  slug:
    type: string
    description: Lowercase letters, digits and hyphens.
    pattern: '^[a-z0-9][a-z0-9-]*$'

  credential:
    description: Where the tool reads a credential when it first contacts the source. A wrong one is a source error.
    oneOf:
      - type: object
        additionalProperties: false
        required: [env]
        properties:
          env:
            type: string
            description: Name of the environment variable holding it.
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
      - type: object
        additionalProperties: false
        required: [command]
        properties:
          command:
            type: string
            description: Command that prints it, such as a secret store's CLI. Split like a shell does, but run without one.
            minLength: 1

  access:
    type: string
    description: Permission checked before running an operation. `read-only` refuses anything that writes to this source.
    enum: [read-only, full]

  fetch_window_seconds:
    type: integer
    description: Data fetched this recently isn't fetched again.
    minimum: 0

  jira_source:
    type: object
    description: A Jira Cloud instance.
    additionalProperties: false
    required: [type, url, access, fetch_window_seconds, done_statuses, credentials]
    properties:
      type: {const: jira}
      url:
        type: string
        format: uri
        description: Base URL of the instance.
      access: {$ref: '#/$defs/access'}
      fetch_window_seconds: {$ref: '#/$defs/fetch_window_seconds'}
      done_statuses:
        type: array
        description: The source's names for the statuses that count as done.
        minItems: 1
        uniqueItems: true
        items:
          type: string
      discarded_statuses:
        type: array
        description: The source's names for the statuses of tickets dropped without being done. Without it, those tickets count as open.
        uniqueItems: true
        items:
          type: string
      blocking_relation:
        type: string
        description: The source's wording for the relation where the first ticket blocks the second, as in "A blocks B". Without it, sprint reports don't show blocked tickets.
      fields:
        type: object
        description: Jira field IDs for the fields that have no fixed ID. A field left out is treated as not existing in this source.
        additionalProperties: false
        properties:
          points:
            type: string
            description: Field holding the ticket's points.
          sprints:
            type: string
            description: Field holding the ticket's sprints.
      custom_fields:
        type: object
        description: |
          Extra ticket fields to carry, by a name of your choice, with the Jira field ID as the value. The tool never
          calculates anything from them. Text, number and single-select fields are supported, and any other type explodes.
        propertyNames: {$ref: '#/$defs/slug'}
        additionalProperties:
          type: string
      credentials:
        type: object
        additionalProperties: false
        required: [email, token]
        properties:
          email: {$ref: '#/$defs/credential'}
          token: {$ref: '#/$defs/credential'}

  toggl_source:
    type: object
    description: A Toggl Track workspace.
    additionalProperties: false
    required: [type, workspace, access, fetch_window_seconds, history_from, credentials]
    properties:
      type: {const: toggl}
      workspace:
        type: integer
        description: Workspace ID.
      access: {$ref: '#/$defs/access'}
      fetch_window_seconds: {$ref: '#/$defs/fetch_window_seconds'}
      history_from:
        type: string
        format: date-time
        description: Date the first fetch starts from. Earlier entries are never fetched.
      credentials:
        type: object
        additionalProperties: false
        required: [token]
        properties:
          token: {$ref: '#/$defs/credential'}

  person:
    type: object
    additionalProperties: false
    required: [identities]
    properties:
      identities:
        type: object
        description: This person's ID in each source, by source slug.
        minProperties: 1
        propertyNames: {$ref: '#/$defs/slug'}
        additionalProperties:
          type: [string, integer]
      weekly_capacity:
        type: object
        description: Hours this person can work per week. Without it, their capacity counts as 0.
        additionalProperties: false
        required: [hours]
        properties:
          hours:
            type: number
            description: Total hours per week.
            minimum: 0
          projects:
            type: object
            description: Hours per week for each project, by project slug. A project left out counts as 0.
            propertyNames: {$ref: '#/$defs/slug'}
            additionalProperties:
              type: number
              minimum: 0

  project:
    type: object
    description: Needs `tickets`, `time`, or both. A project with no `time` reports "no time source", not 0 h.
    additionalProperties: false
    anyOf:
      - required: [tickets]
      - required: [time]
    properties:
      tickets:
        type: object
        description: Where this project's tickets come from.
        additionalProperties: false
        required: [source, space]
        properties:
          source:
            $ref: '#/$defs/slug'
            description: Slug of a ticket source.
          space:
            type: string
            description: The space's key in that source, such as a Jira space key.
      time:
        type: object
        description: Where this project's time entries come from.
        additionalProperties: false
        required: [source, spaces]
        properties:
          source:
            $ref: '#/$defs/slug'
            description: Slug of a time source.
          spaces:
            type: array
            description: Names of the spaces in that source, such as Toggl projects.
            minItems: 1
            uniqueItems: true
            items:
              type: string
      repositories:
        type: array
        description: Slugs of this project's repositories. They break ties when a key's prefix is in several sources.
        uniqueItems: true
        items: {$ref: '#/$defs/slug'}

examples:
  - data_dir: ~/.local/share/cat-herder
    default_non_ticket_percent: 20
    capacity_margin_hours: 2
    sources:
      jira:
        type: jira
        url: https://example.atlassian.net
        access: full
        fetch_window_seconds: 60
        done_statuses: [Done]
        discarded_statuses: [Cancelled]
        blocking_relation: blocks
        fields: {points: customfield_10035, sprints: customfield_10020}
        custom_fields: {size: customfield_10043}
        credentials: {email: {env: JIRA_EMAIL}, token: {command: pass show jira/token}}
      toggl:
        type: toggl
        workspace: 123
        access: read-only
        fetch_window_seconds: 900
        history_from: '2026-01-01T00:00:00+01:00'
        credentials: {token: {env: TOGGL_TOKEN}}
    people:
      ana:
        identities: {jira: <account id>, toggl: 456}
        weekly_capacity:
          hours: 30
          projects: {sat: 8}
    repositories:
      sat: /code/sat
      sat-meteo: /code/sat-meteo
    projects:
      sat:
        tickets: {source: jira, space: SAT}
        time: {source: toggl, spaces: [SAT-2025, SAT-2026]}
        repositories: [sat, sat-meteo]
      admin:
        time: {source: toggl, spaces: [Admin]}
